<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlinePur - Latest Government Jobs, Results & Admit Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Header Section -->
<header>
    <div class="logo">ONLINEPUR</div>
    <p>भारत का अपना विश्वसनीय जॉब एवं शिक्षा पोर्टल</p>
</header>

<!-- Navigation Bar -->
<nav>
    <a href="index.html">Home</a>
    <a href="#latest-jobs">Latest Jobs</a>
    <a href="#results">Results</a>
    <a href="#admit-card">Admit Card</a>
    <a href="#answer-key">Answer Key</a>
</nav>

<!-- Main Grid Container -->
<div class="container">

    <!-- Column 1: Latest Jobs -->
    <div class="card">
        <div class="card-header bg-blue">Latest Jobs</div>
        <ul class="job-list" id="job-list-container">
            <!-- Dynamic jobs from posts.js -->
        </ul>
    </div>

    <!-- Column 2: Results -->
    <div class="card">
        <div class="card-header bg-green">Results</div>
        <ul class="job-list" id="result-list-container">
            <!-- Dynamic results from posts.js -->
        </ul>
    </div>

    <!-- Column 3: Admit Card -->
    <div class="card">
        <div class="card-header bg-orange">Admit Card</div>
        <ul class="job-list" id="admit-list-container">
            <!-- Dynamic admit cards from posts.js -->
        </ul>
    </div>

</div>

<footer>
    <p>© 2026 OnlinePur. All Rights Reserved.</p>
</footer>

<script src="posts.js"></script>
</body>
</html>
