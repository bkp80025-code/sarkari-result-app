<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Job Details - ONLINEPUR</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Exact Sarkari Result Styling Matching Image */
        body { 
            background-color: #ffffff; 
            font-family: Georgia, 'Times New Roman', serif; 
            color: #000;
            margin: 0;
            padding: 10px;
        }

        .post-container { 
            max-width: 980px; 
            margin: 10px auto; 
            background: white; 
            padding: 15px; 
            border: 2px solid #6b0d23; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
        }

        /* Header Style */
        .post-header { 
            text-align: center; 
            color: #6b0d23; 
            font-size: 22px; 
            font-weight: bold; 
            margin-bottom: 15px; 
            border-bottom: 2px solid #6b0d23; 
            padding-bottom: 8px; 
            line-height: 1.3;
        }

        /* Top Quick Info Table */
        .info-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-bottom: 15px; 
            font-size: 14px; 
            border: 2px solid #6b0d23;
        }
        .info-table th, .info-table td { 
            border: 1px solid #000; 
            padding: 8px 10px; 
            text-align: left; 
            line-height: 1.5;
        }
        .info-table th { 
            background-color: #f8fafc; 
            width: 30%; 
            font-weight: bold; 
            color: #6b0d23; 
            font-size: 14px;
        }

        /* Buttons */
        .btn-link { 
            display: inline-block; 
            padding: 6px 14px; 
            background: #2563eb; 
            color: white; 
            text-decoration: none; 
            border-radius: 3px; 
            font-weight: bold; 
            font-size: 13px; 
            font-family: Arial, sans-serif;
        }
        .btn-link:hover { background: #1d4ed8; }

        /* Section Maroon Title */
        .section-title { 
            background: #6b0d23; 
            color: white; 
            padding: 8px 12px; 
            font-size: 16px; 
            margin-top: 20px; 
            margin-bottom: 12px; 
            font-weight: bold; 
            text-align: center; 
        }

        /* Sarkari Result 2-Column Grid Layout (Image Exact Style) */
        .sr-grid-box { 
            display: flex; 
            flex-wrap: wrap; 
            border: 1px solid #000; 
            margin-bottom: 15px; 
        }
        .sr-col { 
            flex: 1; 
            min-width: 280px; 
            border: 1px solid #000; 
            padding: 10px 12px; 
            background: #fff; 
        }
        .sr-col-title { 
            background: #6b0d23; 
            color: white; 
            font-weight: bold; 
            text-align: center; 
            padding: 6px; 
            margin: -10px -12px 10px -12px; 
            font-size: 16px; 
        }

        /* Compact Text Line Height Like Image */
        .post-body { 
            line-height: 1.5; 
            font-size: 14px; 
            color: #000; 
        }

        .post-body h1, .post-body h2, .post-body h3 {
            background-color: #6b0d23;
            color: #ffffff;
            text-align: center;
            padding: 6px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 10px;
            border: 1px solid #000;
        }

        .post-body ul { 
            list-style-type: disc; 
            padding-left: 20px; 
            margin: 5px 0 10px 0; 
        }
        .post-body li { 
            margin-bottom: 3px; 
            font-size: 14px;
        }

        /* Compact Table Inside Body */
        .post-body table { 
            width: 100% !important; 
            border-collapse: collapse !important; 
            margin: 12px 0 !important; 
            border: 1px solid #000 !important;
        }
        .post-body table, .post-body th, .post-body td { 
            border: 1px solid #000 !important; 
            padding: 6px 8px !important; 
            font-size: 14px !important;
        }
        .post-body th { 
            background-color: #6b0d23 !important; 
            color: white !important; 
            font-weight: bold !important; 
            text-align: center !important; 
            font-size: 14px !important;
        }

        /* Bullet Lines Styling */
        .sr-item { 
            display: block; 
            padding: 3px 0; 
            font-size: 14px; 
            color: #000;
        }

        @media (max-width: 600px) {
            .sr-grid-box { flex-direction: column; }
            .post-header { font-size: 18px; }
            .info-table th, .info-table td { font-size: 13px; padding: 6px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo" style="color:#6b0d23; font-size: 28px; font-weight: bold; text-align: center; padding: 10px 0;">ONLINEPUR</div>
</header>

<div class="post-container">
    <h1 class="post-header" id="post-title">Loading Details...</h1>

    <table class="info-table">
        <tr>
            <th>Category</th>
            <td id="post-category">-</td>
        </tr>
        <tr>
            <th>Important Dates</th>
            <td>Start Date: <b id="post-start-date" style="color:#000;">-</b> <br> Last Date: <b id="post-last-date" style="color:#d9381e; font-weight:bold;">-</b></td>
        </tr>
        <tr>
            <th>Application Fee</th>
            <td id="post-fee">-</td>
        </tr>
        <tr>
            <th>Total Vacancy / Posts</th>
            <td id="post-vacancy" style="font-weight:bold; font-size:15px; color:#6b0d23;">-</td>
        </tr>
    </table>

    <div class="section-title">🔗 Important Direct Links</div>
    <table class="info-table" id="links-table">
        <tr id="row-apply">
            <th style="width: 35%;">Apply Online</th>
            <td><a href="#" id="post-apply-btn" target="_blank" class="btn-link">Click Here</a></td>
        </tr>
        <tr id="row-notif">
            <th>Official Notification</th>
            <td><a href="#" id="post-notif-btn" target="_blank" class="btn-link" style="background:#16a34a;">Download Notification</a></td>
        </tr>
    </table>

    <div class="section-title">📑 Full Details & Instructions</div>
    <div class="post-body" id="post-body-content"></div>
</div>

<footer style="text-align: center; padding: 15px; font-size: 13px; color: #64748b; font-family: Arial, sans-serif;">
    <p>© 2026 ONLINEPUR. All Rights Reserved.</p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", async function () {

    function cleanBranding(text) {
        if (!text) return "";
        return text
            .replace(/Sarkari\s*Result/gi, "ONLINEPUR")
            .replace(/Sarkari\s*Exam/gi, "ONLINEPUR")
            .replace(/Sarkari\s*Naukri/gi, "ONLINEPUR")
            .replace(/SarkariResult/gi, "ONLINEPUR")
            .replace(/SarkariExam/gi, "ONLINEPUR")
            .replace(/Sarkari/gi, "ONLINEPUR");
    }

    function renderSarkariResultLayout(rawText) {
        if (!rawText) return "";
        let text = cleanBranding(rawText);

        if (/<table/i.test(text)) {
            return marked.parse(text);
        }

        let lines = text.split('\n');
        let datesContent = [];
        let feeContent = [];
        let generalContent = [];

        let currentSection = 'general';

        lines.forEach(line => {
            let trimmed = line.trim();
            if (!trimmed) return;

            if (/Important Dates/i.test(trimmed)) {
                currentSection = 'dates';
                return;
            } else if (/Application Fee/i.test(trimmed)) {
                currentSection = 'fee';
                return;
            } else if (/Age Limit|Vacancy|Eligibility|How to Apply/i.test(trimmed)) {
                currentSection = 'general';
            }

            if (currentSection === 'dates') {
                datesContent.push(`<span class="sr-item">${trimmed}</span>`);
            } else if (currentSection === 'fee') {
                feeContent.push(`<span class="sr-item">${trimmed}</span>`);
            } else {
                if (trimmed.includes(':')) {
                    generalContent.push(`<span class="sr-item">${trimmed}</span>`);
                } else {
                    generalContent.push(trimmed);
                }
            }
        });

        let gridHTML = "";
        
        if (datesContent.length > 0 || feeContent.length > 0) {
            gridHTML += `
            <div class="sr-grid-box">
                <div class="sr-col">
                    <div class="sr-col-title">Important Dates</div>
                    ${datesContent.join('') || '<span class="sr-item">See Notification</span>'}
                </div>
                <div class="sr-col">
                    <div class="sr-col-title">Application Fee</div>
                    ${feeContent.join('') || '<span class="sr-item">See Notification</span>'}
                </div>
            </div>`;
        }

        let remainingText = generalContent.join('\n\n');
        return gridHTML + marked.parse(remainingText);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const fileName = urlParams.get('file');

    if (!fileName) {
        document.getElementById('post-title').innerText = "Post Not Found!";
        return;
    }

    try {
        const rawUrl = `https://raw.githubusercontent.com/bkp80025-code/sarkari-result-app/main/posts/${fileName}`;
        const res = await fetch(rawUrl);
        if (!res.ok) throw new Error("File fetch failed");

        let text = await res.text();

        const parts = text.split(/^---$/m);
        let frontmatterText = parts[1] || "";
        let bodyText = parts.slice(2).join("---") || "";

        function getField(key) {
            const match = frontmatterText.match(new RegExp(`${key}:\\s*["']?(.*?)["']?$`, 'm'));
            return match ? match[1].trim() : "";
        }

        const title = cleanBranding(getField('title')) || fileName.replace('.md', '');
        const category = getField('category') || "Notification";
        const startDate = getField('start_date') || "N/A";
        const lastDate = getField('last_date') || "N/A";
        const feeInfo = getField('fee_info') || "N/A";
        const totalPosts = getField('total_posts') || "N/A";
        const applyLink = getField('apply_link');
        const notifLink = getField('notification_link');

        document.getElementById('post-title').innerText = title;
        document.getElementById('page-title').innerText = title + " - ONLINEPUR";
        document.getElementById('post-category').innerText = category;
        document.getElementById('post-start-date').innerText = startDate;
        document.getElementById('post-last-date').innerText = lastDate;
        document.getElementById('post-fee').innerText = feeInfo;
        document.getElementById('post-vacancy').innerText = totalPosts;

        if (applyLink) {
            document.getElementById('post-apply-btn').href = applyLink;
        } else {
            document.getElementById('row-apply').style.display = 'none';
        }

        if (notifLink) {
            document.getElementById('post-notif-btn').href = notifLink;
        } else {
            document.getElementById('row-notif').style.display = 'none';
        }

        const linksTable = document.getElementById('links-table');
        const customLinksMatch = frontmatterText.match(/custom_links:([\s\S]*?)(?=\n[a-z_]+:|$)/i);
        
        if (customLinksMatch) {
            const linksBlock = customLinksMatch[1];
            const linkItems = linksBlock.split('- title:');
            
            linkItems.forEach(item => {
                const tMatch = item.match(/^\s*["']?(.*?)["']?$/m);
                const uMatch = item.match(/url:\s*["']?(.*?)["']?$/m);
                
                if (tMatch && uMatch && tMatch[1].trim() && uMatch[1].trim()) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<th style="width: 35%;">${tMatch[1].trim()}</th><td><a href="${uMatch[1].trim()}" target="_blank" class="btn-link">Click Here</a></td>`;
                    linksTable.appendChild(tr);
                }
            });
        }

        document.getElementById('post-body-content').innerHTML = renderSarkariResultLayout(bodyText);

    } catch (err) {
        console.error("Error loading post:", err);
        document.getElementById('post-title').innerText = "Error Loading Details!";
    }
});
</script>

</body>
</html>
