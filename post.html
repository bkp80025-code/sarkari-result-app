<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ONLINEPUR - Job & Result Updates</title>

  <meta name="description" content="ONLINEPUR पर सरकारी नौकरी, रिजल्ट, एडमिट कार्ड और सरकारी योजनाओं की जानकारी पढ़ें।">
  <meta name="robots" content="index,follow">
  <meta name="theme-color" content="#6b0d23">

  <link rel="canonical" id="canonical-url" href="https://sarkari-result-app.bkp80025.workers.dev/">

  <meta property="og:site_name" content="ONLINEPUR">
  <meta property="og:type" content="article">
  <meta property="og:title" id="og-title" content="ONLINEPUR - Job & Result Updates">
  <meta property="og:description" id="og-description" content="सरकारी नौकरी, रिजल्ट और एडमिट कार्ड की जानकारी।">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 15px;
      color: #1e293b;
    }

    .header-bar {
      text-align: center;
      padding: 14px 0;
      background: #fff;
      border-bottom: 4px solid #6b0d23;
      margin-bottom: 16px;
      border-radius: 8px;
      box-shadow: 0 2px 4px rgba(0,0,0,.05);
    }

    .site-logo {
      font-size: 26px;
      font-weight: 800;
      color: #6b0d23;
      text-decoration: none;
      letter-spacing: 1px;
    }

    .post-container {
      max-width: 950px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      box-shadow: 0 4px 8px rgba(0,0,0,.05);
    }

    .info-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 15px;
      border: 1px solid #cbd5e1;
    }

    .info-table th,
    .info-table td {
      border: 1px solid #cbd5e1;
      padding: 10px;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .info-table th {
      background: #f8fafc;
      width: 30%;
      color: #6b0d23;
      font-weight: 700;
    }

    .btn-link {
      display: inline-block;
      padding: 8px 16px;
      background: #2563eb;
      color: #fff !important;
      text-decoration: none;
      border-radius: 5px;
      font-weight: 600;
      font-size: 14px;
      margin: 0 6px 4px 0;
    }

    .btn-link:hover {
      background: #1d4ed8;
    }

    .btn-green {
      background: #16a34a;
    }

    .btn-green:hover {
      background: #15803d;
    }

    .post-body {
      font-size: 16px;
      line-height: 1.7;
      color: #1e293b;
      overflow-wrap: anywhere;
    }

    .post-body h1 {
      font-size: 22px;
      color: #6b0d23;
      border-bottom: 2px solid #6b0d23;
      padding-bottom: 6px;
      margin: 18px 0 14px;
    }

    .post-body h2,
    .post-body h3 {
      background: #6b0d23;
      color: #fff;
      padding: 8px 14px;
      font-size: 16px;
      font-weight: 700;
      margin: 22px 0 12px;
      border-radius: 5px;
    }

    .post-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
      border: 1px solid #cbd5e1;
      display: block;
      overflow-x: auto;
    }

    @media (min-width: 640px) {
      .post-body table {
        display: table;
      }
    }

    .post-body th,
    .post-body td {
      border: 1px solid #cbd5e1;
      padding: 10px 12px;
      font-size: 15px;
    }

    .post-body th {
      background: #6b0d23;
      color: #fff;
      font-weight: 700;
      text-align: left;
    }

    .post-body tr:nth-child(even) {
      background: #f8fafc;
    }

    .post-body blockquote {
      background: #fefce8;
      border-left: 4px solid #eab308;
      margin: 14px 0;
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      color: #854d0e;
    }

    .post-body a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: underline;
      overflow-wrap: anywhere;
    }

    .post-body p {
      margin-bottom: 12px;
    }

    .post-body ul,
    .post-body ol {
      padding-left: 20px;
      margin: 10px 0;
    }

    .post-body li {
      margin-bottom: 6px;
    }

    .status-message {
      padding: 16px;
      background: #fff7ed;
      border-left: 4px solid #ea580c;
      border-radius: 6px;
    }

    footer {
      text-align: center;
      padding: 20px 0;
      font-size: 13px;
      color: #64748b;
    }

    @media (max-width: 640px) {
      body {
        padding: 8px;
      }

      .post-container {
        padding: 14px;
      }

      .info-table th,
      .info-table td {
        font-size: 13px;
        padding: 8px;
      }

      .post-body {
        font-size: 15px;
      }

      .site-logo {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <div class="header-bar">
    <a href="/" class="site-logo">ONLINEPUR</a>
  </div>

  <main class="post-container">
    <table class="info-table" id="meta-table" style="display:none">
      <tbody>
        <tr>
          <th>Category</th>
          <td id="post-category">-</td>
        </tr>

        <tr>
          <th>Important Dates</th>
          <td>
            Start Date: <b id="post-start-date">-</b>
            |
            Last Date: <b id="post-last-date" style="color:#dc2626">-</b>
          </td>
        </tr>

        <tr>
          <th>Application Fee</th>
          <td id="post-fee">-</td>
        </tr>

        <tr>
          <th>Total Vacancy</th>
          <td id="post-vacancy" style="font-weight:bold;color:#6b0d23">-</td>
        </tr>

        <tr id="row-apply">
          <th>Direct Links</th>
          <td>
            <a href="#" id="post-apply-btn" target="_blank"
               rel="noopener noreferrer" class="btn-link">
              Apply Online
            </a>

            <a href="#" id="post-notif-btn" target="_blank"
               rel="noopener noreferrer" class="btn-link btn-green">
              Notification
            </a>
          </td>
        </tr>
      </tbody>
    </table>

    <article class="post-body" id="post-body-content" aria-live="polite">
      <p>पोस्ट लोड हो रही है...</p>
    </article>
  </main>

  <footer>© 2026 ONLINEPUR. All Rights Reserved.</footer>

  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      const content = document.getElementById("post-body-content");
      const metaTable = document.getElementById("meta-table");
      const params = new URLSearchParams(window.location.search);
      const fileName = params.get("file");

      function cleanBranding(value = "") {
        return String(value)
          .replace(/Sarkari\s*Result/gi, "ONLINEPUR")
          .replace(/Sarkari\s*Exam/gi, "ONLINEPUR")
          .replace(/Sarkari\s*Naukri/gi, "ONLINEPUR")
          .replace(/SarkariResult/gi, "ONLINEPUR")
          .replace(/SarkariExam/gi, "ONLINEPUR");
      }

      function getField(frontmatter, key) {
        const match = frontmatter.match(
          new RegExp("^" + key + ":\\s*(.*?)\\s*$", "m")
        );

        return match
          ? match[1].trim().replace(/^(['"])(.*)\1$/, "$2")
          : "";
      }

      function safeUrl(value) {
        try {
          const parsed = new URL(value);

          return ["https:", "http:"].includes(parsed.protocol)
            ? parsed.href
            : "";
        } catch (_) {
          return "";
        }
      }

      if (!fileName || !/^[a-zA-Z0-9_-]+\.md$/i.test(fileName)) {
        content.innerHTML =
          '<div class="status-message">पोस्ट लिंक सही नहीं है। कृपया Homepage से पोस्ट खोलें।</div>';
        return;
      }

      try {
        const rawUrl =
          "https://raw.githubusercontent.com/bkp80025-code/sarkari-result-app/main/posts/" +
          encodeURIComponent(fileName);

        const response = await fetch(rawUrl);

        if (!response.ok) {
          throw new Error("Post file not found: " + response.status);
        }

        const text = await response.text();

        const fmMatch = text.match(
          /^---\s*\r?\n([\s\S]*?)\r?\n---\s*(?:\r?\n|$)/
        );

        const frontmatter = fmMatch ? fmMatch[1] : "";
        let body = fmMatch ? text.slice(fmMatch[0].length) : text;

        const title = cleanBranding(
          getField(frontmatter, "title") ||
          fileName.replace(/\.md$/i, "").replace(/[-_]/g, " ")
        );

        const category = cleanBranding(
          getField(frontmatter, "category")
        );

        const startDate = getField(frontmatter, "start_date");
        const lastDate = getField(frontmatter, "last_date");
        const fee = cleanBranding(getField(frontmatter, "fee_info"));
        const vacancy = getField(frontmatter, "total_posts");

        const applyLink = safeUrl(
          getField(frontmatter, "apply_link")
        );

        const notificationLink = safeUrl(
          getField(frontmatter, "notification_link")
        );

        document.title = title + " - ONLINEPUR";

        const description = cleanBranding(
          body.replace(/[#*`>\[\]()!|]/g, " ")
        ).replace(/\s+/g, " ").trim().slice(0, 155)
          || title + " की पूरी जानकारी ONLINEPUR पर पढ़ें।";

        document.querySelector('meta[name="description"]').content =
          description;

        document.querySelector('meta[property="og:title"]').content =
          title + " - ONLINEPUR";

        document.querySelector('meta[property="og:description"]').content =
          description;

        document.getElementById("canonical-url").href =
          window.location.href;

        if (
          category || startDate || lastDate || fee ||
          vacancy || applyLink || notificationLink
        ) {
          metaTable.style.display = "table";

          document.getElementById("post-category").textContent =
            category || "N/A";

          document.getElementById("post-start-date").textContent =
            startDate || "N/A";

          document.getElementById("post-last-date").textContent =
            lastDate || "N/A";

          document.getElementById("post-fee").textContent =
            fee || "N/A";

          document.getElementById("post-vacancy").textContent =
            vacancy || "N/A";

          const applyButton =
            document.getElementById("post-apply-btn");

          const notifButton =
            document.getElementById("post-notif-btn");

          if (applyLink) {
            applyButton.href = applyLink;
          } else {
            applyButton.hidden = true;
          }

          if (notificationLink) {
            notifButton.href = notificationLink;
          } else {
            notifButton.hidden = true;
          }

          if (!applyLink && !notificationLink) {
            document.getElementById("row-apply").hidden = true;
          }
        }

        body = cleanBranding(body);

        if (typeof marked === "undefined") {
          throw new Error("Markdown library load nahi hui.");
        }

        marked.setOptions({
          breaks: true,
          gfm: true
        });

        content.innerHTML = marked.parse(body);

        const h1 = content.querySelector("h1");

        if (!h1) {
          const heading = document.createElement("h1");
          heading.textContent = title;
          content.prepend(heading);
        }

      } catch (error) {
        console.error("ONLINEPUR post error:", error);

        content.innerHTML =
          '<div class="status-message">पोस्ट लोड नहीं हो सकी। इंटरनेट चेक करके कुछ देर बाद दोबारा प्रयास करें।</div>';
      }
    });
  </script>
</body>
</html>
